name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      # The pre-commit hook's generic file checks, for contributors who never
      # ran `make hooks`. lint and typecheck are skipped: check-all runs them.
      - run: SKIP=lint,typecheck uvx pre-commit run --all-files --show-diff-on-failure
      - run: make check-all
      - run: make gate
