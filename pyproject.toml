[project]
name = "evals-primer"
version = "0.1.0"
description = "Small offline lessons for building LLM evaluation suites from scratch"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dinu Gherman", email = "gherman@darwin.in-berlin.de" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "inspect-ai>=0.3.291",
    "openai-agents>=0.25.0",
    "python-dotenv>=1.2.4",
]

[project.urls]
Repository = "https://github.com/deeplook/evals-primer"

[dependency-groups]
dev = ["mypy>=1.0", "pytest>=8", "ruff>=0.11"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "examples"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
